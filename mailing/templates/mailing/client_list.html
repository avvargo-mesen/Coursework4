{% extends 'mailing/base.html' %}

{% block content %}
    <div class="container mt-5">
        <a class="btn btn-primary mb-3" href="{% url 'mailing:ClientCreate' %}">Создать клиента</a>
        {% for client in object_list %}
            <p>{{ client.email }}, {{ client.full_name }}, {{ client.comment }}. </p>
            <p> <a class="btn btn-warning btn-sm" href="{% url 'mailing:ClientUpdate' client.pk %}">Редактировать</a>
            <a class="btn btn-danger btn-sm" href="{% url 'mailing:ClientDelete' client.pk %}">Удалить</a> </p>

      {% endfor %}
    </div>
{% endblock %}

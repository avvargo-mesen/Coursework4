{% extends 'mailing/base.html' %}

{% block content %}
    <div class="container mt-5">
        <a class="btn btn-primary mb-3" href="{% url 'mailing:MessageCreate' %}">Создать сообщение</a>
        {% for message in object_list %}
            <p>{{ message.subject }}, {{ message.body }}. </p>
            <p> <a class="btn btn-warning btn-sm" href="{% url 'mailing:MessageUpdate' message.pk %}">Редактировать</a>
            <a class="btn btn-danger btn-sm" href="{% url 'mailing:MessageDelete' message.pk %}">Удалить</a> </p>

      {% endfor %}
    </div>
{% endblock %}

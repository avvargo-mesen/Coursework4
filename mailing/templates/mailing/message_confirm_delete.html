{% extends 'mailing/base.html' %}

{% block content %}
    <div class="container mt-5">
        <form method="post">
            {% csrf_token %}
            <p>«Удалить сообщение {{ object.subject }}?»</p>
            <button type="submit" class="btn btn-primary">Удалить</button>
            <a href="{% url 'mailing:MessageList' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
